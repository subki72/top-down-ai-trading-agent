name: CI & Quality Assurance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Test Suite
        run: pytest tests/ -v

      - name: Build Docker Container Image
        run: |
          docker build -t trading-agent:smoke .

      - name: Scan container image with Trivy for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'trading-agent:smoke'
          format: 'table'
          severity: 'CRITICAL,HIGH'
